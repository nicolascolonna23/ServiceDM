name: Hawk Odometros

on:
  workflow_dispatch:
    inputs:
      solo_empresas:
        description: "Filtrar empresas (subcadena, coma). Vacio = toda la flota."
        required: false
        default: "CATAMARCA"
      dry_run:
        description: "Probar sin escribir en la planilla (1 = si)"
        required: false
        default: ""
  schedule:
    - cron: "0 11 * * 1-5"   # 08:00 ART, lun-vie

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install selenium requests pandas openpyxl gspread google-auth

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: false

      - name: Limpiar chromedriver del PATH
        run: sudo rm -f "$(command -v chromedriver)" || true

      - name: Correr scraper
        env:
          HAWK_USER: ${{ secrets.HAWK_USER }}
          HAWK_PASS: ${{ secrets.HAWK_PASS }}
          SOLO_EMPRESAS: ${{ github.event.inputs.solo_empresas }}
          SHEET_ID_SERVICES: ${{ secrets.SHEET_ID_SERVICES }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEETS_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python hawk_km.py

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilometrajes
          path: data/
          retention-days: 30

      - name: Commit al repo
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.xlsx data/historico.csv || true
          git diff --staged --quiet || git commit -m "km $(date -u +%Y-%m-%d)"
          git push
